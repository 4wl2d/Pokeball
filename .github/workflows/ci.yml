name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kotlin reference, examples, rules, benchmark
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (architecture rules, adapter conformance, tutorial, knowledge algebra, benchmark regression)
        run: ./gradlew build checkModuleBoundaries
      - name: Conformance traces pass the language-neutral oracles
        run: python3 ../../tools/oracles.py ballarch-runtime/build/conformance-traces/*.jsonl
      - name: The benchmark reproduces the published results byte for byte
        run: |
          ./gradlew :benchmark:runner:run --args="2000 build/bench"
          cmp build/bench/results.json ../../benchmark/results/results.json

  firmware:
    name: Firmware reference (C11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/c
    steps:
      - uses: actions/checkout@v4
      - name: gcc
        run: make CC=gcc
      - name: clang
        run: make clean && make CC=clang
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize

  rtl:
    name: Hardware reference (SystemVerilog)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/rtl
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog, Verilator and Yosys
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog verilator yosys
      - run: make

  docs:
    name: Documentation links, snippets and benchmark report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_links.py
      - run: python3 tools/check_snippets.py
      - name: The trace oracles detect seeded violations
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: The benchmark report is up to date with its data
        run: |
          python3 benchmark/report.py benchmark/results/results.json benchmark/results
          git diff --exit-code benchmark/results/RESULTS.md
      - name: Every change-request patch applies and its recorded size is current
        run: python3 benchmark/changes/measure.py --check

  paper:
    name: Paper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science lmodern cm-super latexmk
      - run: make arxiv

  alloy:
    name: Alloy model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bash formal/alloy/fetch-alloy.sh && python3 formal/alloy/run.py
