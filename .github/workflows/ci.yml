name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, tests, architecture rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (includes architecture rules, adapter conformance, tutorial)
        run: ./gradlew build checkModuleBoundaries

  docs:
    name: Documentation links and snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_links.py
      - run: python3 tools/check_snippets.py

  alloy:
    name: Alloy model
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ' '), 'formal/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bash formal/alloy/fetch-alloy.sh && python3 formal/alloy/run.py
