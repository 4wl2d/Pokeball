name: Skills

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test source reading and standalone packages
        run: python3 -m unittest discover -s tests -p 'test_skill_tools.py' -v
      - name: Check reproducible skill generation
        run: python3 scripts/build_skills.py --check
      - name: Check standalone skills and source integrity
        run: python3 scripts/check_skills.py
